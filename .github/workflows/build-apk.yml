name: Build Android APKs (MôBuss Cliente & Motorista)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apks:
    name: Build MôBuss Client & Driver APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync & Build MôBuss Cliente APK (ao.mobuss.client)
        env:
          VITE_APP_TARGET: client
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build:client
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PMOBUSS_TARGET=client --no-daemon

      - name: Upload MôBuss Cliente APK
        uses: actions/upload-artifact@v4
        with:
          name: MoBuss-Client-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Sync & Build MôBuss Motorista APK (ao.mobuss.driver)
        env:
          VITE_APP_TARGET: driver
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build:driver
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PMOBUSS_TARGET=driver --no-daemon

      - name: Upload MôBuss Motorista APK
        uses: actions/upload-artifact@v4
        with:
          name: MoBuss-Driver-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
